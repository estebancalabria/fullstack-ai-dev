<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Chat Eco</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8edf7;
      background: #0c1220;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #27365c 0, #111827 45%, #0c1220 100%);
    }

    .chat {
      width: min(100%, 720px);
      height: min(780px, calc(100dvh - 48px));
      min-height: 360px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #151e30;
      border: 1px solid #33415b;
      border-radius: 22px;
      box-shadow: 0 24px 70px #0006;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px;
      border-bottom: 1px solid #2a3851;
    }

    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: #7164ed;
      font-size: 20px;
      font-weight: 700;
    }

    h1 { margin: 0; font-size: 18px; }
    .subtitle { margin: 4px 0 0; color: #aab8cf; font-size: 13px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .message {
      width: fit-content;
      max-width: 85%;
      margin: 0 0 14px;
      padding: 12px 16px;
      border-radius: 16px 16px 16px 4px;
      background: #26344c;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      margin-left: auto;
      border-radius: 16px 16px 4px 16px;
      background: #7164ed;
      color: white;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 18px 24px 24px;
      border-top: 1px solid #2a3851;
    }

    input, button { font: inherit; }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      color: #fff;
      background: #0f1726;
      border: 1px solid #3b4a64;
      border-radius: 12px;
    }
    input::placeholder { color: #8d9bb2; }
    input:focus-visible, button:focus-visible { outline: 2px solid #b1aaff; outline-offset: 2px; }

    button {
      padding: 12px 20px;
      color: white;
      background: #7164ed;
      border: 0;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #8378f5; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .chat { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; }
      .header, .messages { padding: 20px; }
      .composer { padding: 16px 20px 20px; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="Chat Eco">
    <header class="header">
      <div class="avatar" aria-hidden="true">E</div>
      <div>
        <h1>Chat Eco</h1>
        <p class="subtitle">Un chatbot que repite tus mensajes</p>
      </div>
    </header>

    <div class="messages" id="messages" role="log" aria-label="Conversación" aria-live="polite">
      <p class="message">¡Hola! Escribime algo y te lo repetiré.</p>
    </div>

    <form class="composer" id="chat-form">
      <input id="message-input" type="text" aria-label="Tu mensaje" placeholder="Escribí un mensaje..." autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const messages = document.getElementById("messages");

    function addMessage(text, isUser) {
      const message = document.createElement("p");
      message.className = isUser ? "message user" : "message";
      message.textContent = text;
      messages.appendChild(message);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value;
      if (!text.trim()) return;

      addMessage(text, true);
      addMessage(text, false);
      input.value = "";
      messages.scrollTop = messages.scrollHeight;
      input.focus();
    });
  </script>
</body>
</html>
